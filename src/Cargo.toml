# Modified for concat-song on 2026-10-07; see FORK-NOTICE.md.
[workspace]
resolver = "3"
members = [
    "crates/concat-api",
    "crates/concat-cli",
    "crates/concat-core",
    "crates/concat-effects",
    "crates/concat-export",
    "crates/concat-host",
    "crates/concat-media",
    "crates/concat-perf",
    "crates/concat-project",
    "crates/concat-render",
    "crates/concat-server",
    "crates/concat-speech",
    "crates/concat-text",
    "crates/concat-vision",
]

[workspace.package]
version = "0.2.6"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"  # + plugin exception, see LICENSE-EXCEPTIONS.md

[workspace.dependencies]
concat-core = { path = "crates/concat-core" }
concat-media = { path = "crates/concat-media" }
concat-project = { path = "crates/concat-project" }
concat-render = { path = "crates/concat-render" }
concat-export = { path = "crates/concat-export" }
concat-host = { path = "crates/concat-host" }
concat-api = { path = "crates/concat-api" }
concat-server = { path = "crates/concat-server" }
concat-speech = { path = "crates/concat-speech" }
concat-effects = { path = "crates/concat-effects" }
concat-text = { path = "crates/concat-text" }
concat-vision = { path = "crates/concat-vision" }

serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }

# The retained engine always builds the GPU compositor. `gpu` remains a
# compatibility feature name, not an optional CPU-only path.
wgpu = "30"
pollster = "0.4"

# ONNX Runtime, for the cutout models. The binaries come prebuilt for every
# supported target, with the platform's own accelerator behind them:
# CoreML on macOS and iOS, DirectML on Windows, NNAPI on Android.
ort = "=2.0.0-rc.13"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# Cleverness is the enemy of a codebase you maintain alone.
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Optimised engine iteration and performance CI without release's thin LTO
# or single codegen unit. Incremental rebuilds keep this profile useful for
# repeated measurements while release remains the production baseline.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Decoding and compositing are unusably slow in an unoptimised build, even when
# the rest of the engine is being debugged.
[profile.dev.package."*"]
opt-level = 2

# No incremental caches for the everyday check-and-test builds; see
# .cargo/config.toml for why it is said here and not there.
[profile.dev]
incremental = false

[profile.test]
incremental = false
