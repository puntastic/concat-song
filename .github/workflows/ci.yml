# Modified for concat-song on 2026-10-07; see FORK-NOTICE.md.
name: Engine CI

# Branch pushes are covered by pull requests; main is checked after landing.
# No tags, publishing, installers, GUI, or mobile jobs are wired here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      speech:
        description: Also lint and test optional speech, including Chatterbox (heavy native build)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Format, model consistency, and modification notices
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The notice checker compares the current tree with its recorded base.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: src
      - run: python3 scripts/models.py --check
      - run: python3 -m unittest discover -s scripts/tests -p 'test_modification_notices.py'
      - run: python3 scripts/check_modification_notices.py check
      - name: Coverage boundaries
        if: always()
        env:
          SPEECH_REQUESTED: ${{ inputs.speech || false }}
        run: |
          {
            echo '### Configured coverage (see job results for what ran)'
            echo '- Native engine, API, CLI, text/effects, media, and gRPC target Linux and Windows MSVC.'
            echo '- Linux requires a working software Vulkan adapter; Windows reports adapter/codec skips.'
            echo '- Jobs also check wasm32 portability and Linux quick performance budgets.'
            echo "- Optional speech/Chatterbox requested: $SPEECH_REQUESTED (manual opt-in, not covered when false)."
            echo '- Model inference with downloaded weights, real audio devices, hardware codecs, macOS/mobile, and distribution are not validated by these jobs.'
          } >> "$GITHUB_STEP_SUMMARY"

  engine:
    name: Native headless engine
    needs: source
    uses: ./.github/workflows/engine-native.yml

  web:
    name: Engine portability on wasm32
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: wasm32-1.93.0
      - run: >-
          cargo clippy --locked
          -p concat-core -p concat-project -p concat-effects -p concat-render -p concat-text
          --features concat-render/gpu --target wasm32-unknown-unknown
          -- -D warnings
        working-directory: src

  speech:
    name: Optional speech and Chatterbox
    needs: source
    if: github.event_name == 'workflow_dispatch' && inputs.speech
    uses: ./.github/workflows/engine-native.yml
    with:
      speech: true
